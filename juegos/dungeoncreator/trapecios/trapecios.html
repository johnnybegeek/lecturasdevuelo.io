<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rejilla de trapecios: movimiento</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: #16212b;
    font-family: system-ui, sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  #mapa { position: relative; flex: 1; min-height: 50vh; background: #22303d; }
  #lienzo { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(13, 25, 36, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    font: 700 15px/1 ui-monospace, Menlo, Consolas, monospace;
    padding: 6px 10px;
    border-radius: 8px;
    pointer-events: none;
  }
  #hud.agotado { background: rgba(160, 47, 47, 0.95); }
  #leyenda {
    position: absolute;
    left: 10px;
    bottom: 10px;
    pointer-events: none;
    font-size: 11px;
    line-height: 1.6;
    color: #d5e0ea;
    background: rgba(13, 25, 36, 0.8);
    padding: 4px 8px;
    border-radius: 6px;
  }
  #leyenda span { display: inline-block; width: 10px; height: 10px; border: 1px solid #6a8093; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  #mando {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 16px;
    padding: 12px;
    background: #1e2c39;
  }
  #pad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); gap: 6px; }
  #pad button {
    font-size: 20px;
    border: 1px solid #46596a;
    border-radius: 10px;
    background: #2a3a49;
    color: #e6eef5;
    padding: 0;
    touch-action: manipulation;
  }
  #pad button:active { background: #3d5468; }
  #pad button.centro { background: #22303d; cursor: default; }
  #reiniciar {
    font: 600 14px system-ui, sans-serif;
    padding: 10px 14px;
    border: 1px solid #46596a;
    border-radius: 10px;
    background: #2a3a49;
    color: #e6eef5;
  }
  #pista { font-size: 12px; color: #9fb2c2; text-align: center; width: 100%; }
</style>
</head>
<body>
<div id="mapa">
  <canvas id="lienzo"></canvas>
  <div id="hud">PM:10</div>
  <div id="leyenda">
    <span style="background:#2fb26a"></span>posición&nbsp;
    <span style="background:#6fae8c"></span>8 trapecios visibles&nbsp;
    <span style="background:#35513f"></span>explorados&nbsp;
    <span style="background:#2b3a48"></span>sin explorar
  </div>
</div>
<div id="mando">
  <div id="pad" aria-label="Mando de dirección">
    <button data-dir="NW" aria-label="Noroeste">↖</button>
    <button data-dir="N" aria-label="Norte">↑</button>
    <button data-dir="NE" aria-label="Noreste">↗</button>
    <button data-dir="W" aria-label="Oeste">←</button>
    <button class="centro" aria-label="Posición" tabindex="-1">●</button>
    <button data-dir="E" aria-label="Este">→</button>
    <button data-dir="SW" aria-label="Suroeste">↙</button>
    <button data-dir="S" aria-label="Sur">↓</button>
    <button data-dir="SE" aria-label="Sureste">↘</button>
  </div>
  <button id="reiniciar">Reiniciar</button>
  <div id="pista">Teclado: numérico 1-9 (8=N, 2=S, 4=O, 6=E, diagonales 7 9 1 3) o QWE / A D / ZXC. Cada paso cuesta 1 PM.</div>
</div>

<script>
'use strict';

/* ================================================================
   NÚCLEO: geometría y reglas. Sin DOM, sin dependencias.
   Rejilla: cada hexágono (plano por arriba) se parte en 4
   trapecios rectángulos con dos cortes perpendiculares por el
   centro: uno por vértices opuestos (E-O) y otro por los puntos
   medios de las aristas opuestas (N-S).
   Cada trapecio tiene exactamente 8 vecinos: 4 por arista y
   4 por vértice. Los centroides caen en una red rectangular,
   así que la rejilla es isomorfa a la rejilla cuadrada con
   movimiento de rey: (i, j) enteros y 8 direcciones.
   ================================================================ */

const R = 40;                    // radio del hexágono (unidades del mundo)
const A = R * Math.sqrt(3) / 2;  // apotema
const PASO_X = 0.75 * R;         // paso horizontal entre centros de trapecios
const PASO_Y = A;                // paso vertical
const PM_INICIAL = 10;

// Rosa de los vientos -> delta (i, j). Mundo con Y hacia arriba.
const DIRS = {
  N:  [0,  1], NE: [ 1, 1], E:  [ 1, 0], SE: [ 1, -1],
  S:  [0, -1], SW: [-1, -1], W: [-1, 0], NW: [-1,  1]
};

const mod = (n, m) => ((n % m) + m) % m;

// (i, j) -> hexágono (q, r) y cuarto del hexágono ('TR' | 'TL' | 'BL' | 'BR')
function celda(i, j) {
  const U = 2 * i + 1, V = 2 * j + 1;
  const su = mod(U, 4) === 1 ? 1 : -1;       // lado este (+) u oeste (-) del corte vertical
  const q = (U - su) / 4;                    // columna del hexágono
  const rem = V - 2 * q;
  const sv = mod(rem, 4) === 1 ? 1 : -1;     // mitad norte (+) o sur (-) del corte horizontal
  const r = (rem - sv) / 4;                  // fila del hexágono
  const cuadro = (sv > 0 ? 'T' : 'B') + (su > 0 ? 'R' : 'L');
  return { q, r, cuadro };
}

// Centro del hexágono (q, r) en coordenadas del mundo (Y hacia arriba)
function centroHex(q, r) {
  return { x: 1.5 * R * q, y: 2 * A * r + A * q };
}

// Vértices del trapecio, relativos al centro de su hexágono
const PLANTILLAS = {
  TR: [[0, 0], [R, 0], [R / 2, A], [0, A]],
  TL: [[0, A], [-R / 2, A], [-R, 0], [0, 0]],
  BL: [[0, 0], [-R, 0], [-R / 2, -A], [0, -A]],
  BR: [[0, -A], [R / 2, -A], [R, 0], [0, 0]]
};

// Vértices del hexágono, relativos a su centro
const VERTS_HEX = [[R, 0], [R / 2, A], [-R / 2, A], [-R, 0], [-R / 2, -A], [R / 2, -A]];

function poligono(i, j) {
  const { q, r, cuadro } = celda(i, j);
  const c = centroHex(q, r);
  return PLANTILLAS[cuadro].map(([x, y]) => [c.x + x, c.y + y]);
}

function centroide(i, j) {
  const p = poligono(i, j);
  return {
    x: p.reduce((s, v) => s + v[0], 0) / p.length,
    y: p.reduce((s, v) => s + v[1], 0) / p.length
  };
}

const clave = (i, j) => i + ',' + j;

// Estado de partida
function estadoInicial() {
  const s = { i: 0, j: 0, pm: PM_INICIAL, descubiertas: new Set() };
  revelar(s);
  return s;
}

// Marca como descubiertas la casilla actual y sus 8 vecinas
function revelar(s) {
  s.descubiertas.add(clave(s.i, s.j));
  for (const d of Object.values(DIRS)) {
    s.descubiertas.add(clave(s.i + d[0], s.j + d[1]));
  }
}

// Regla de movimiento: 1 PM por paso en cualquiera de las 8 direcciones.
// Devuelve true si el paso se ha ejecutado.
function mover(estado, dir) {
  if (!DIRS[dir] || estado.pm <= 0) return false;
  const [di, dj] = DIRS[dir];
  estado.i += di;
  estado.j += dj;
  estado.pm--;
  revelar(estado);
  return true;
}

/* ================================================================
   INTERFAZ: entrada y render (única parte que toca el DOM)
   ================================================================ */

const lienzo = document.getElementById('lienzo');
const hud = document.getElementById('hud');
const ctx = lienzo.getContext('2d');
let estado = estadoInicial();

function refrescarHUD() {
  hud.textContent = 'PM:' + estado.pm;
  hud.classList.toggle('agotado', estado.pm <= 0);
}

function dibujar() {
  const w = lienzo.clientWidth;
  const h = lienzo.clientHeight;
  const escala = w / 420;                    // ~420 unidades de mundo de ancho
  const cam = centroide(estado.i, estado.j); // cámara centrada en el jugador
  const X = x => w / 2 + (x - cam.x) * escala;
  const Y = y => h / 2 - (y - cam.y) * escala;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#22303d';
  ctx.fillRect(0, 0, w, h);

  // Trapecios dentro del encuadre
  const ni = Math.ceil(w / 2 / (PASO_X * escala)) + 2;
  const nj = Math.ceil(h / 2 / (PASO_Y * escala)) + 2;
  for (let i = estado.i - ni; i <= estado.i + ni; i++) {
    for (let j = estado.j - nj; j <= estado.j + nj; j++) {
      const p = poligono(i, j);
      const actual = i === estado.i && j === estado.j;
      const vecina = !actual && Math.abs(i - estado.i) <= 1 && Math.abs(j - estado.j) <= 1;
      const descubierta = estado.descubiertas.has(clave(i, j));
      ctx.beginPath();
      p.forEach(([x, y], k) => (k ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))));
      ctx.closePath();
      ctx.fillStyle = actual ? '#2fb26a'
                     : vecina ? '#6fae8c'
                     : descubierta ? '#35513f'
                     : '#2b3a48';
      ctx.fill();
      ctx.strokeStyle = '#46596a';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // Contorno de los hexágonos: la capa macro
  const { q: pq, r: pr } = celda(estado.i, estado.j);
  const nq = Math.ceil(w / 2 / (1.5 * R * escala)) + 2;
  const nr = Math.ceil(h / 2 / (2 * A * escala)) + 2;
  ctx.beginPath();
  for (let q = pq - nq; q <= pq + nq; q++) {
    for (let r = pr - nr; r <= pr + nr; r++) {
      const c = centroHex(q, r);
      VERTS_HEX.forEach(([x, y], k) => {
        const sx = X(c.x + x), sy = Y(c.y + y);
        k ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy);
      });
      ctx.closePath();
    }
  }
  ctx.strokeStyle = 'rgba(213, 224, 234, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Jugador
  const pc = centroide(estado.i, estado.j);
  ctx.beginPath();
  ctx.arc(X(pc.x), Y(pc.y), 7, 0, Math.PI * 2);
  ctx.fillStyle = '#f5f9ff';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#16324f';
  ctx.stroke();
}

function intentarMover(dir) {
  if (mover(estado, dir)) {
    dibujar();
    refrescarHUD();
  }
}

function redimensionar() {
  const dpr = window.devicePixelRatio || 1;
  const w = lienzo.clientWidth, h = lienzo.clientHeight;
  if (w < 1 || h < 1) return;
  lienzo.width = Math.round(w * dpr);
  lienzo.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dibujar();
}

// Entrada 1: teclado (numérico con o sin Bloq Num, y QWEASDZXC)
const TECLAS = {
  '8': 'N', 'arrowup': 'N', 'w': 'N',
  '9': 'NE', 'pageup': 'NE', 'e': 'NE',
  '6': 'E', 'arrowright': 'E', 'd': 'E',
  '3': 'SE', 'pagedown': 'SE', 'c': 'SE',
  '2': 'S', 'arrowdown': 'S', 'x': 'S',
  '1': 'SW', 'end': 'SW', 'z': 'SW',
  '4': 'W', 'arrowleft': 'W', 'a': 'W',
  '7': 'NW', 'home': 'NW', 'q': 'NW'
};
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const dir = TECLAS[e.key.toLowerCase()];
  if (!dir) return;
  e.preventDefault();
  intentarMover(dir);
});

// Entrada 2: mando táctil en pantalla
document.querySelectorAll('#pad button[data-dir]').forEach(b => {
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    intentarMover(b.dataset.dir);
  });
});

// Reinicio de la partida
document.getElementById('reiniciar').addEventListener('click', () => {
  estado = estadoInicial();
  dibujar();
  refrescarHUD();
});

window.addEventListener('resize', redimensionar);
new ResizeObserver(redimensionar).observe(document.getElementById('mapa'));
redimensionar();
refrescarHUD();
</script>
</body>
</html>
